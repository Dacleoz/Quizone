<section class="card">
  <div class="row"><h2>Invita i giocatori</h2></div>
  <div class="share">
    <div class="stack">
      <div class="bigcode">{{code}}</div>
      <div class="linkbox">{{link}}</div>
      <div class="btns">
        <button class="btn ghost small" data-act="copy" data-link="{{link}}">Copia link giocatori</button>
        <a class="btn ghost small" href="{{link}}&v=ranking" target="_blank" rel="noopener">Apri classifica</a>
      </div>
    </div>
    <canvas class="qr" data-qr="{{link}}" aria-label="QR code del link"></canvas>
  </div>
</section>
