<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Quizone</title>
  <link rel="icon" type="image/webp" href="/favicon.webp">
  <meta name="description" content="Quiz a squadre con classifica dal vivo.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/components/player/main.js"></script>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <h1>Quiz<span>one</span><script>var d=new Date(),m=d.getMonth(),g=d.getDate();if(m==10&&g>=22||m==0&&g<=6)document.write('<img src="https://cdn.jsdelivr.net/gh/jdecked/twemoji@15.1.0/assets/svg/1f384.svg" alt="" style="height:.9em;margin-left:.2em;vertical-align:-.05em">')</script></h1>
        <p id="subtitle"></p>
      </div>
    </header>
    <div id="clock" class="clock" hidden></div>
    <main id="view" class="stack"></main>
  </div>
  <dialog id="penalty" class="modal">
    <form method="dialog">
      <div class="modal-icon" aria-hidden="true">!</div>
      <h2>Sei uscito dal gioco</h2>
      <p class="lead">Durante la partita non si può lasciare la pagina.</p>
      <div class="modal-pts">−<span data-penalty></span> punti</div>
      <button class="btn primary">Ho capito</button>
    </form>
  </dialog>
</body>
</html>
